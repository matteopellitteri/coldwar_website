        <header>

                <h3><b>Photos of...</b></h3>

                <p>
                    During the Cold War...

            </section>

            <section class="filters"> <!-- FILTERS SECTION -->
                <input type="text" id="myName" onkeyup="myFunctionName()" placeholder="Search for name..." title="NAME">

            <section class="cards">

                    <div>
                        <img src="photos/250px-Sir_Winston_Churchill_-_19086236948-2138968114.jpg" alt="Winston Churchill">

            <section class="searchbar"> <!-- SEARCHBAR -->

                    <input type="text" placeholder="Search...">
